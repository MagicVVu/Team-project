# Local coordination only. Merge with the formal isolated deployment config.
services:
  agent:
    image: magicvvu/agent:p5-reviewed-text-v1
    build:
      context: ${MAGICVVU_AGENT_SOURCE_DIR:-/home/magicvvu_ai/workspace/agent}
      dockerfile: Dockerfile.interaction
    command: ["python", "-m", "uvicorn", "interaction.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8767"]
    environment:
      P3_ENGINE: ${MAGICVVU_AI_ENGINE:-rules}
    healthcheck:
      test: ["CMD", "python", "-m", "interaction.health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
# Preserve existing service/user tokens, ai_net, UID 10002, read_only, tmpfs,
# resource limits and shared agent_cache. This file alone cannot deploy safely.
