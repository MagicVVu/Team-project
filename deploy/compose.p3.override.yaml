# Local coordination artifact; merge only after backend contract acceptance.
services:
  agent:
    image: magicvvu/agent:p3-integration-v1
    build:
      context: ${MAGICVVU_AGENT_SOURCE_DIR:-/home/magicvvu_ai/workspace/agent}
      dockerfile: Dockerfile.p3
    command: ["python", "-m", "uvicorn", "p3.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8767"]
    environment:
      P3_ENGINE: ${MAGICVVU_P3_ENGINE:-rules}
    healthcheck:
      test: ["CMD", "python", "-m", "p3.health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
# Preserve existing service tokens, ai_net isolation, cache volume, read_only,
# tmpfs and UID 10002. This file alone is not a runnable deployment.
