# DRAFT P2 ONLY. Future: /etc/logrotate.d/magicvvu-api
# Separate directory avoids distro /var/log/nginx/*.log overlap; still check -d.
/var/log/magicvvu-nginx/access.log {
    daily
    rotate 7
    maxsize 10M
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data adm
    sharedscripts
    postrotate
        if [ -s /run/nginx.pid ]; then
            /usr/sbin/nginx -s reopen
        fi
    endscript
}
