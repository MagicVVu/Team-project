# DRAFT P2 ONLY. Future: /etc/nginx/conf.d/00-magicvvu-common.conf
# Must be included INSIDE http {}, before sites-enabled/*; no listener here.
map "$request_method:$uri" $magicvvu_route {
    default denied;
    include /etc/nginx/snippets/magicvvu-route-map.conf;
}
map $magicvvu_route $magicvvu_login_ip {
    default "";
    auth_login $binary_remote_addr;
}
map $magicvvu_route $magicvvu_login_global {
    default "";
    auth_login magicvvu-login;
}
limit_req_zone $magicvvu_login_ip zone=magicvvu_login_ip:1m rate=5r/m;
limit_req_zone $magicvvu_login_global zone=magicvvu_login_global:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=magicvvu_api_ip:1m rate=10r/s;
limit_conn_zone $server_name zone=magicvvu_total:1m;

map $request_method $magicvvu_method {
    default OTHER;
    GET GET;
    POST POST;
    PATCH PATCH;
    DELETE DELETE;
    HEAD HEAD;
    OPTIONS OPTIONS;
    PUT PUT;
}
# No raw URI, query, client IP, user agent, referer, credentials, cookie, or body.
log_format magicvvu_min escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"method":"$magicvvu_method","route":"$magicvvu_route",'
    '"status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,'
    '"upstream_seconds":"$upstream_response_time","upstream_status":"$upstream_status"}';
