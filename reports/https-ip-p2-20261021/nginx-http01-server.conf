# DRAFT P2 ONLY. Future: /etc/nginx/snippets/magicvvu-http01-server.conf
# Include from ONE selected site file, at http {} context, NOT inside server {}.
server {
    listen 80 default_server;
    server_name 8.134.172.165;
    server_tokens off;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 10s;
    access_log /var/log/magicvvu-nginx/access.log magicvvu_min;
    # Native error logs can include raw request URIs even at high severity.
    error_log /dev/null crit;
    if ($host != 8.134.172.165) { return 444; }

    # A token is one base64url filename; no directory listing or dotfiles.
    location ~ "^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$" {
        limit_except GET { deny all; }
        root /var/www/magicvvu-acme;
        default_type text/plain;
        try_files $uri =404;
        autoindex off;
        access_log off;
    }
    # Never forward a plaintext API body; never redirect credentials to HTTPS.
    location / { return 404; }
}
