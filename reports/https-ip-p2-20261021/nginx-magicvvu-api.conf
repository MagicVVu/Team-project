# DRAFT P2 ONLY — FINAL HTTPS TEMPLATE, NEVER ENABLE BEFORE PRODUCTION CERT EXISTS.
# Future: /etc/nginx/sites-available/magicvvu-api
# Replaces nginx-magicvvu-http-only.conf at the SAME target; never enable both.
# Requires nginx-http-common.conf and all reviewed snippets installed first.
include /etc/nginx/snippets/magicvvu-http01-server.conf;

server {
    listen 443 ssl default_server;
    server_name 8.134.172.165;
    server_tokens off;

    # P3: named PRODUCTION lineage only; staging is in a separate root directory.
    ssl_certificate /etc/letsencrypt/live/magicvvu-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magicvvu-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:magicvvu_tls:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_in_file_only off;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 15s;
    send_timeout 20s;
    reset_timedout_connection on;
    proxy_read_timeout 20s;
    access_log /var/log/magicvvu-nginx/access.log magicvvu_min;
    error_log /dev/null crit;
    add_header X-Content-Type-Options nosniff always;

    # Safe return-only checks, before proxying or selecting an upstream.
    if ($host != 8.134.172.165) { return 444; }
    if ($magicvvu_route = denied) { return 404; }
    limit_req zone=magicvvu_login_ip burst=3 nodelay;
    limit_req zone=magicvvu_login_global burst=3 nodelay;
    limit_req zone=magicvvu_api_ip burst=30 nodelay;
    limit_req_status 429;
    limit_conn magicvvu_total 16;
    limit_conn_status 429;

    # Explicit defense in addition to method+path default-deny map.
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /openapi.json { return 404; }
    location ~ ^/(docs|redoc|debug|metrics|admin)(/|$) { return 404; }

    location ~ ^/api/v1/(agent|drafts|operations)(/|$) {
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/magicvvu-proxy-common.conf;
    }
    location /api/v1/ {
        include /etc/nginx/snippets/magicvvu-proxy-common.conf;
    }
    location / { return 404; }
}
