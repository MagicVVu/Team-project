# DRAFT P2 ONLY. Future: /etc/nginx/snippets/magicvvu-proxy-common.conf
# Include inside reviewed API locations. No URI suffix preserves original paths.
proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_set_header Host 8.134.172.165;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host 8.134.172.165;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Forwarded "";
proxy_set_header X-User-Id "";
proxy_set_header X-Household-Id "";
proxy_set_header Connection "";
# Authorization is passed unchanged by the normal proxy behavior.
proxy_connect_timeout 3s;
proxy_send_timeout 15s;
proxy_request_buffering on;
proxy_buffering off;
proxy_max_temp_file_size 0;
proxy_ignore_client_abort off;
proxy_next_upstream off;
proxy_intercept_errors off;
proxy_cache off;
