 let cameraExpiry='',cameraName='牛奶',cameraQty='',cameraUnit='盒';
 const cameraValidDate=v=>{if(!v)return true;const s=v.replaceAll('/','-').trim();if(!/^\d{4}-\d{1,2}-\d{1,2}$/.test(s))return false;const [y,m,d]=s.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d;};
 const cameraField=label=>[...document.querySelectorAll('.camera-draft-form .field')].find(x=>x.querySelector('span')?.textContent.startsWith(label))?.querySelector('input,select');
 function validateCameraDraft(){const name=cameraField('物品名称')?.value.trim(),q=cameraField('数量')?.value,unit=cameraField('单位')?.value;const dates=['保质日期','买入时间','开封时间'].map(x=>cameraField(x)?.value||'');const good=Boolean(name&&q&&Number(q)>0&&unit&&dates.every(cameraValidDate));const b=document.getElementById('camera-confirm');if(b)b.disabled=!good;return good;}
 function setupCamera(){const root=document.querySelector('.camera-phone');if(root){if(root.dataset.cameraState==='loading'&&isPreview)timer=setTimeout(()=>render('cameraresult'),1400);root.querySelectorAll('[data-camera-shutter]').forEach(b=>b.onclick=()=>{if(root.dataset.cameraMode==='label'){toast('示例标签未读到日期，请手动填写或留空。');return}render('cameraloading')});root.querySelectorAll('[data-camera-album]').forEach(b=>b.onclick=()=>{toast('相册导入的界面演示使用当前示例照片。');render('cameraloading')});root.querySelector('[data-camera-flash]')?.addEventListener('click',e=>{const b=e.currentTarget;b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'))});root.querySelector('[data-camera-help]')?.addEventListener('click',()=>toast('对准单件物品，避开反光；标签模式对准包装日期。'));const exp=document.getElementById('camera-expiry');if(exp){exp.value=cameraExpiry;exp.addEventListener('input',()=>{cameraExpiry=exp.value;document.getElementById('camera-date-error').hidden=cameraValidDate(exp.value);root.querySelectorAll('[data-go=cameradraft]:not([data-camera-clear-date])').forEach(b=>b.disabled=!cameraValidDate(exp.value))})}}
 if(document.querySelector('.camera-draft-form')){cameraField('物品名称').value=cameraName;cameraField('数量').value=cameraQty;cameraField('单位').value=cameraUnit;cameraField('保质日期').value=cameraExpiry;validateCameraDraft();document.querySelector('.camera-draft-form').addEventListener('input',()=>{cameraName=cameraField('物品名称').value;cameraQty=cameraField('数量').value;cameraUnit=cameraField('单位').value;cameraExpiry=cameraField('保质日期').value;validateCameraDraft()});document.getElementById('camera-confirm').onclick=e=>{if(!validateCameraDraft()){document.getElementById('camera-draft-error').hidden=false;return}e.currentTarget.disabled=true;e.currentTarget.textContent='已确认（演示）';toast('拍照草稿已确认（演示），未写入真实库存。');}}
 }
 document.addEventListener('click',e=>{if(e.target.closest('[data-camera-clear-date]'))cameraExpiry='';},true);
 render(current);
</script></body></html>
